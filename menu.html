<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Coffee House</title>
    <link rel="icon" href="assets/icons/logo-light.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/fonts/font.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/menu.css">
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
    <script src="js/theme.js" defer></script>
    <script src="js/nav.js" defer></script>
    <script src="js/menu.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a class="header__logo" href="index.html" aria-label="Resource">
          <img
            class="header__logo-img header__logo-img--light"
            src="assets/icons/logo-light.svg"
            alt="Resource"
            width="100"
            height="60">
          <img
            class="header__logo-img header__logo-img--dark"
            src="assets/icons/logo-dark.svg"
            alt=""
            width="100"
            height="60">
        </a>
        <nav class="header__nav" aria-label="Primary">
          <ul class="header__list">
            <li class="header__item">
              <a class="header__link" href="index.html#favorites"
                >Favorite coffee</a
              >
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#about">About</a>
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#mobile-app"
                >Mobile app</a
              >
            </li>
            <li class="header__item">
              <a class="header__link" href="index.html#contacts">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-pressed="false"
            aria-label="Switch to dark theme"
          >
            <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
              <img src="assets/icons/Sun.svg" alt="" width="22" height="22">
            </span>
            <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
              <img src="assets/icons/Moon.svg" alt="" width="18" height="18">
            </span>
          </button>
          <a class="header__menu header__menu--current" href="menu.html">
            Menu
            <img
              class="header__menu-icon"
              src="assets/icons/coffee-cup.svg"
              alt=""
              width="20"
              height="20">
          </a>
          <button class="burger" type="button" aria-label="Open menu">
            <img
              src="assets/icons/button-icon-burger.svg"
              alt=""
              width="44"
              height="44">
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="menu" id="menu" data-menu aria-labelledby="menu-title">
        <div class="container">
          <h1 class="section-title" id="menu-title">
            Behind each of our<br class="menu__title-break">
            cups hides an
            <span class="accent">amazing surprise</span>
          </h1>

          <div class="menu__tabs" role="tablist" aria-label="Menu categories">
            <button
              id="tab-coffee"
              class="menu__tab menu__tab--active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="menu-panel"
              tabindex="0"
              data-category="coffee"
            >
              <span class="menu__tab-icon" aria-hidden="true">
                <img
                  src="assets/images/coffee.png"
                  alt="Coffee"
                  width="16"
                  height="24">
              </span>
              Coffee
            </button>
            <button
              id="tab-tea"
              class="menu__tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="menu-panel"
              tabindex="-1"
              data-category="tea"
            >
              <span class="menu__tab-icon" aria-hidden="true">
                <img
                  src="assets/images/tea.png"
                  alt="Tea"
                  width="16"
                  height="24">
              </span>
              Tea
            </button>
            <button
              id="tab-dessert"
              class="menu__tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="menu-panel"
              tabindex="-1"
              data-category="dessert"
            >
              <span class="menu__tab-icon" aria-hidden="true">
                <img
                  src="assets/images/dessert.png"
                  alt="Dessert"
                  width="16"
                  height="24">
              </span>
              Dessert
            </button>
          </div>

          <div
            class="menu__panel"
            id="menu-panel"
            role="tabpanel"
            aria-labelledby="tab-coffee"
          >
            <ul class="menu__grid" data-menu-grid></ul>
          </div>

          <button
            class="menu__more"
            type="button"
            data-menu-more
            hidden
            aria-label="Show more products"
          >
            <img
              src="assets/icons/button-icon-dark-update.svg"
              alt=""
              width="20"
              height="20">
          </button>
        </div>
      </section>
    </main>

    <footer class="footer" id="contacts">
      <div class="container">
        <div class="footer__panel">
          <div class="footer__brand">
            <h2 class="footer__title">
              Sip, Savor, Smile.<br>
              <span class="accent">It's coffee time!</span>
            </h2>
            <ul class="footer__socials">
              <li>
                <a
                  class="footer__social"
                  href="https://twitter.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Twitter"
                >
                  <img src="assets/icons/twitter.svg" alt="" width="24" height="24">
                </a>
              </li>
              <li>
                <a
                  class="footer__social"
                  href="https://instagram.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Instagram"
                >
                  <img src="assets/icons/instagram.svg" alt="" width="24" height="24">
                </a>
              </li>
              <li>
                <a
                  class="footer__social"
                  href="https://facebook.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Facebook"
                >
                  <img src="assets/icons/facebook.svg" alt="" width="24" height="24">
                </a>
              </li>
            </ul>
          </div>
          <div class="footer__contacts">
            <h3 class="footer__contacts-title">Contact us</h3>
            <ul class="footer__list">
              <li>
                <a
                  class="footer__link"
                  href="https://maps.google.com/?q=8558+Green+Rd,+LA"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <img
                    src="assets/icons/pin-alt.svg"
                    alt=""
                    width="20"
                    height="20">
                  8558 Green Rd., LA
                </a>
              </li>
              <li>
                <a class="footer__link" href="tel:+16035550123">
                  <img
                    src="assets/icons/phone.svg"
                    alt=""
                    width="20"
                    height="20">
                  +1 (603) 555-0123
                </a>
              </li>
              <li>
                <span class="footer__hours">
                  <img
                    src="assets/icons/clock.svg"
                    alt=""
                    width="20"
                    height="20">
                  Mon-Sat: 9:00-23:00
                </span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
